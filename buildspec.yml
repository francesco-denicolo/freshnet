# =============================================================================
# AWS CodeBuild — build dell'immagine TFT e push su ECR
# =============================================================================
# CodeBuild gira nativamente su x86_64 Linux => l'immagine è già linux/amd64,
# quella che serve a SageMaker (niente emulazione arm64 sul Mac, niente Docker locale).
#
# Richiede: environment con privilegedMode=true (necessario per costruire immagini Docker).
version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: tft-gpu
    IMAGE_TAG: latest

phases:
  pre_build:
    commands:
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR=$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - echo "ECR = $ECR/$IMAGE_REPO_NAME:$IMAGE_TAG"
      - aws ecr describe-repositories --repository-names $IMAGE_REPO_NAME >/dev/null 2>&1 || aws ecr create-repository --repository-name $IMAGE_REPO_NAME >/dev/null
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR

  build:
    commands:
      - echo "Build $(date)"
      - docker build -t $IMAGE_REPO_NAME:$IMAGE_TAG .
      - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $ECR/$IMAGE_REPO_NAME:$IMAGE_TAG

  post_build:
    commands:
      - docker push $ECR/$IMAGE_REPO_NAME:$IMAGE_TAG
      - |
        echo "=============================================================="
        echo " IMAGE URI: $ECR/$IMAGE_REPO_NAME:$IMAGE_TAG"
        echo " Lancia il training job con:"
        echo "   python pipeline/sagemaker_launch.py --image $ECR/$IMAGE_REPO_NAME:$IMAGE_TAG --role <SageMakerExecutionRole>"
        echo "=============================================================="
      - printf '{"image_uri":"%s/%s:%s"}\n' "$ECR" "$IMAGE_REPO_NAME" "$IMAGE_TAG" > image_uri.json

artifacts:
  files:
    - image_uri.json
